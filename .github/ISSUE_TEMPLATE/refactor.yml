name: "♻️ 리팩토링 (Refactor)"
description: 동작은 그대로 두고 코드 구조를 개선합니다.
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 작업 분야
      description: 이 이슈가 속한 작업 분야를 고르세요. 고른 분야의 라벨이 자동으로 붙습니다.
      options:
        - 1. 기획·설계
        - 2. 문서 수집·전처리
        - 3. 검색·AI
        - 4. 백엔드·권한
        - 5. 프론트엔드
        - 6. 품질·테스트
        - 7. 프로젝트 관리·문서
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 대상
      description: 리팩토링할 파일, 모듈, 기능을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 리팩토링 이유
      description: 현재 코드의 문제점을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: 개선 방안
      value: |
        - [ ]
        - [ ]
