name: "📝 문서 (Docs)"
description: README, 위키 등 문서를 작성하거나 수정합니다.
title: "[Docs] "
labels: ["docs"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 작업 분야
      description: 이 이슈가 속한 작업 분야를 고르세요. 고른 분야의 라벨이 자동으로 붙습니다.
      options:
        - 1. 기획·설계
        - 2. 문서 수집·전처리
        - 3. 검색·AI
        - 4. 백엔드·권한
        - 5. 프론트엔드
        - 6. 품질·테스트
        - 7. 프로젝트 관리·문서
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 어떤 문서를 작성·수정하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      value: |
        - [ ]
