name: Slack 알림 (develop 업데이트)

# develop 브랜치에 커밋이 들어오면(PR 머지 포함) Slack 채널로 알림을 보냅니다.
# 필요한 설정: 레포 Settings → Secrets and variables → Actions 에 SLACK_WEBHOOK_URL 등록
on:
  push:
    branches: [develop]
  workflow_dispatch: # Actions 탭에서 수동으로 테스트 알림 보내기

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Slack으로 알림 보내기
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          COMPARE: ${{ github.event.compare }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret이 없어 알림을 보내지 않았습니다."
            exit 0
          fi

          # Slack 서식이 깨지지 않도록 & < > 를 이스케이프하고, 커밋은 최대 20개까지 표시
          lines=$(echo "$COMMITS" | jq -r '
            (. // [])[:20][]
            | (.message | split("\n")[0] | gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;")) as $msg
            | "• <\(.url)|`\(.id[0:7])`> \($msg) - \(.author.name)"')
          [ -z "$lines" ] && lines="• (수동 실행 테스트 알림)"
          link="${COMPARE:-$RUN_URL}"

          text=$(printf '*%s* `develop` 브랜치가 업데이트됐어요 (by %s)\n%s\n<%s|변경 내용 보기>\n\n로컬에 반영하기: `git switch develop && git pull`' \
            "$REPO" "$ACTOR" "$lines" "$link")

          jq -n --arg text "$text" '{text: $text}' \
            | curl -sSf -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
